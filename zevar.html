<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEAVR | Handcrafted Brass Jewelry</title>
    <style>
        :root {
            --primary: #c5a059; /* Ancient Gold / Brass Tone */
            --bg: #121212;      /* Deep Dark Background */
            --card-bg: #1e1e1e;
            --text: #f4f4f4;
            --muted: #a0a0a0;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        header {
            text-align: center;
            padding: 3rem 1rem;
            border-bottom: 1px solid #333;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 0.3em;
            color: var(--primary);
            margin: 0;
        }

        p.tagline {
            font-style: italic;
            color: var(--muted);
            margin-top: 0.5rem;
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .section-title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 2rem;
            color: var(--primary);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            padding: 1.5rem;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 4px;
        }

        .card h3 {
            margin: 1rem 0 0.5rem 0;
            font-size: 1.3rem;
        }

        .card .price {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .btn {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .btn:hover {
            background-color: #e0b86c;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--muted);
            border-top: 1px solid #333;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>ZEAVR</h1>
        <p class="tagline">Ancient Elegance • Handcrafted Brass Jewelry</p>
    </header>

    <div class="container">
        <h2 class="section-title">Featured Brass Collection</h2>
        
        <div class="grid">
            <!-- Item 1 -->
            <div class="card">
                <img src="https://via.placeholder.com/300x300?text=Brass+Cuff" alt="Antique Brass Cuff">
                <h3>Antique Temple Cuff</h3>
                <p class="price">$45.00</p>
                <button class="btn">Inquire / Buy</button>
            </div>

            <!-- Item 2 -->
            <div class="card">
                <img src="https://via.placeholder.com/300x300?text=Brass+Pendant" alt="Ancient Brass Pendant">
                <h3>Solstice Brass Pendant</h3>
                <p class="price">$38.00</p>
                <button class="btn">Inquire / Buy</button>
            </div>

            <!-- Item 3 -->
            <div class="card">
                <img src="https://via.placeholder.com/300x300?text=Brass+Earrings" alt="Handcrafted Earrings">
                <h3>Artisan Chandelier Earrings</h3>
                <p class="price">$32.00</p>
                <button class="btn">Inquire / Buy</button>
            </div>
        </div>
    </div>

  <footer>
        <p>&copy; 2026 ZEAVR Jewelry. All rights reserved.</p>
    </footer>

</body>
</html>
